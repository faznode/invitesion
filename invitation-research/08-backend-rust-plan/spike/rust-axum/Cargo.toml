[package]
name = "invitesion-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway spike (brief 03 §18): public guest-page read + RSVP write against the Invitesion schema. Not product code."

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 4
