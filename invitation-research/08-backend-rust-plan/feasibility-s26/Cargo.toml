[package]
name = "invitesion-api-feasibility"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated feasibility experiment (s26; ADR-O11 allows it before the gates) for ADR-A2's Rust stack on one domain function. Not product code and not wired to the app."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
thiserror = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rsa = "0.9"
base64 = "0.23"
rand = "0.8"

# Test-time RSA key generation is slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
